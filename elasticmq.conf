# elasticmq.conf

include classpath("application.conf")

# Node address settings configuration
node-address {
    protocol = "http"
    host = "localhost"
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    # SQS limits messages to 256KB by default. Adjust if needed.
    sqs-limits = "strict" 
}

# Pre-define queues for your application layout here
queues {
    # Replace 'my-test-queue' with your actual queue name
    my-test-queue {
        defaultVisibilityTimeout = 10 seconds
        delay = 0 seconds
        receiveMessageWait = 0 seconds
        deadLetterTarget {
            name = "my-test-queue-dlq"
            maxReceiveCount = 3
        }
    }
    # Dead Letter Queue configuration
    my-test-queue-dlq {
        defaultVisibilityTimeout = 10 seconds
        delay = 0 seconds
        receiveMessageWait = 0 seconds
    }
}

# Optional: Enable performance metrics tracking
aws {
    region = "us-east-1"
    accountId = "000000000000"
}
