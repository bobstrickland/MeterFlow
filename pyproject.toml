[project]
name = "meterflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bob Strickland", email = "bob.sansmal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.0",
    "pyspark-client>=4.2.0",
    "pytest>=9.1.1",
]

[project.scripts]
meterflow = "meterflow:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
